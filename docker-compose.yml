# ============================================================================
#  Apache Airflow — local learning stack (CeleryExecutor)
# ----------------------------------------------------------------------------
#  Services:
#    postgres          -> metadata database (stores DAGs, runs, XComs, users)
#    redis             -> Celery message broker (queue between scheduler/worker)
#    airflow-webserver -> the UI at http://localhost:8080
#    airflow-scheduler -> decides what to run and when
#    airflow-worker    -> actually executes the tasks (Celery worker)
#    airflow-init      -> one-shot job: runs DB migration + creates admin user
# ============================================================================

# ---------------------------------------------------------------------------
#  A YAML "anchor" (&airflow-common). Every Airflow service below reuses this
#  block with `<<: *airflow-common` instead of repeating 30 lines each time.
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.5}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-CeleryExecutor}
    # SQLAlchemy connection string pointing Airflow at the Postgres service.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Celery result backend (where task results/states are recorded).
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    # Redis is the broker Celery uses to hand tasks to the worker.
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    # Encryption key for secrets stored in the DB (comes from .env).
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # Don't auto-run every past schedule the moment a DAG is unpaused.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # Don't ship the dozens of example DAGs — keeps the UI focused on ours.
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Needed so the webserver can create the default API auth backends.
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # Let the scheduler pick up new/edited DAG files quickly (every 30s).
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    # Turn on the scheduler's HTTP health endpoint (port 8974) so its Docker
    # healthcheck below can succeed. Off by default in Airflow 2.10.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Any packages listed in .env get pip-installed on container start.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # Define the "fs_default" filesystem connection the FileSensor needs.
    # Airflow reads AIRFLOW_CONN_<CONN_ID> env vars as ready-made connections,
    # so no manual `airflow connections add` step is required.
    AIRFLOW_CONN_FS_DEFAULT: 'fs://'
  volumes:
    # Host folder : container folder. Editing files on the host is live-reloaded.
    - ./dags:/opt/airflow/dags                 # your DAG definitions
    - ./logs:/opt/airflow/logs                 # task execution logs
    - ./plugins:/opt/airflow/plugins           # custom plugins (empty for now)
    - ./sample_data:/opt/airflow/sample_data   # the CSV the FileSensor waits for
    - ./output:/opt/airflow/output             # where the DAG writes its report
  # Run containers as your host user so generated files stay editable by you.
  user: "${AIRFLOW_UID:-50000}:0"
  # Every Airflow service must wait until Postgres + Redis are healthy.
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # -------------------------------------------------------------------------
  #  PostgreSQL: Airflow's metadata database.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # Named volume => the database survives `docker compose down` (but is
      # removed by `docker compose down -v`).
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # -------------------------------------------------------------------------
  #  Redis: the Celery broker (message queue).
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # -------------------------------------------------------------------------
  #  Webserver: the UI you open in the browser.
  # -------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"   # host:container — this is why localhost:8080 works
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  #  Scheduler: the brain — parses DAGs and queues tasks when they're due.
  # -------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  #  Worker: the Celery worker that actually executes task code.
  # -------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      # Ask Celery whether this worker is alive and reporting in.
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  #  Init: runs ONCE. Migrates the DB schema and creates the admin user,
  #  then exits. The other services wait for it to finish successfully.
  # -------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Initialising Airflow metadata DB and admin user..."
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/output
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Air --lastname Flow --role Admin \
          --email admin@example.com || true
        echo "Init complete."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    # Init needs to write to the mounted folders, so run as root for this step.
    user: "0:0"

# Named volume declaration for the Postgres data directory.
volumes:
  postgres-db-volume:
